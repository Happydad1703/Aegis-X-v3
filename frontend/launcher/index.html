<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis-X v3 Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
    .toolbar { padding: 0.5rem 1rem; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .toolbar h1 { margin: 0; font-size: 1rem; }
    .toolbar a, .toolbar button { padding: 0.4rem 0.8rem; background: #21262d; color: #58a6ff; border: 1px solid #30363d; border-radius: 6px; text-decoration: none; font-size: 0.85rem; cursor: pointer; }
    .toolbar a:hover, .toolbar button:hover { background: #30363d; }
    .single-panel { display: flex; flex-direction: column; height: calc(100vh - 52px); }
    .single-panel .top { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .single-panel .top h2 { margin: 0; padding: 0.25rem 0.5rem; font-size: 0.85rem; background: #21262d; }
    .single-panel .top iframe { flex: 1; border: none; width: 100%; }
    .single-panel .bottom { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid #30363d; }
    .single-panel .bottom h2 { margin: 0; padding: 0.25rem 0.5rem; font-size: 0.85rem; background: #21262d; }
    .single-panel .bottom iframe { flex: 1; border: none; width: 100%; }
    .wsl-bar { padding: 0.4rem 1rem; background: #161b22; border-top: 1px solid #30363d; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .wsl-bar a { color: #58a6ff; text-decoration: none; font-size: 0.9rem; }
    .wsl-bar a:hover { text-decoration: underline; }
    .multi-buttons { padding: 1rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .multi-buttons p { width: 100%; margin: 0 0 0.5rem; color: #8b949e; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Aegis-X v3 Launcher</h1>
    <a href="#" id="btn-single">단일 디스플레이 (세로 2분할)</a>
    <a href="#" id="btn-multi">복수 디스플레이 (창 분리)</a>
    <span style="color:#8b949e; font-size:0.8rem;">Backend: <span id="backend-url">/</span></span>
  </div>

  <div id="view-single" class="single-panel">
    <div class="top">
      <h2>Warroom</h2>
      <iframe id="iframe-warroom" title="Warroom" src=""></iframe>
    </div>
    <div class="bottom">
      <h2>Dashboard & Control Panel</h2>
      <iframe id="iframe-dashboard" title="Dashboard & Control" src=""></iframe>
    </div>
    <div class="wsl-bar">
      <strong>WSL Terminal:</strong>
      <a href="/static/run_wsl_terminal.bat" download="run_wsl_terminal.bat">run_wsl_terminal.bat 다운로드</a>
      <span style="color:#8b949e; font-size:0.8rem;">→ 다운로드 후 실행하거나, 프로젝트 루트에서 scripts\run_wsl_terminal.bat 실행</span>
    </div>
  </div>

  <div id="view-multi" style="display:none; padding: 1rem;">
    <p>각 버튼을 클릭한 뒤 창을 원하는 모니터로 드래그하세요.</p>
    <div class="multi-buttons">
      <button type="button" id="open-warroom">Warroom 열기 (창 1)</button>
      <button type="button" id="open-dashboard">Dashboard & Control 열기 (창 2)</button>
    </div>
    <div class="wsl-bar" style="margin-top: 1rem; border-radius: 8px;">
      <strong>WSL Terminal:</strong>
      <a href="/static/run_wsl_terminal.bat" download="run_wsl_terminal.bat">run_wsl_terminal.bat 다운로드</a>
    </div>
  </div>

  <script>
    (function() {
      var base = window.location.origin || '';
      var warroomUrl = base + '/warroom/';
      var dashboardUrl = base + '/warroom/';  // same page; can use /warroom/#control later

      document.getElementById('backend-url').textContent = base || 'localhost:8000';

      document.getElementById('iframe-warroom').src = warroomUrl;
      document.getElementById('iframe-dashboard').src = dashboardUrl;

      document.getElementById('btn-single').onclick = function(e) {
        e.preventDefault();
        document.getElementById('view-single').style.display = 'flex';
        document.getElementById('view-multi').style.display = 'none';
      };
      document.getElementById('btn-multi').onclick = function(e) {
        e.preventDefault();
        document.getElementById('view-single').style.display = 'none';
        document.getElementById('view-multi').style.display = 'block';
      };

      document.getElementById('open-warroom').onclick = function() {
        window.open(warroomUrl, 'AegisX-Warroom', 'width=1200,height=800');
      };
      document.getElementById('open-dashboard').onclick = function() {
        window.open(dashboardUrl, 'AegisX-Dashboard', 'width=1200,height=800');
      };
    })();
  </script>
</body>
</html>
